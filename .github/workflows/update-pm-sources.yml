name: Refresh individual PS5 Payload Manager sources

on:
  workflow_dispatch:
  schedule:
    - cron: "13 4 * * *"
  push:
    paths:
      - 'scripts/update_pm_sources.py'
      - '.github/workflows/update-pm-sources.yml'

permissions:
  contents: write

concurrency:
  group: ps5-pm-sources-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify script
        run: python3 -m py_compile scripts/update_pm_sources.py
      - name: Regenerate separate upstream catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_pm_sources.py --output pm-sources
      - name: Publish changed JSON catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pm-sources/*.json
          if git diff --cached --quiet; then
            echo "No version or checksum changes"
          else
            git commit -m "Refresh individual Payload Manager upstream source catalogs"
            git push origin HEAD:main
          fi
