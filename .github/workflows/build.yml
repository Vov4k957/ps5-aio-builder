name: Build PS5 AIO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      profile:
        description: "Which public-source payload profile?"
        required: true
        default: standard
        type: choice
        options:
          - standard
          - afterdns
          - extended
          - zftpd
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'standard' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Install PS5 SDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 wget unzip make
      - name: Install official PS5 SDK
        run: |
          curl --fail --location --retry 3 --output /tmp/ps5-payload-sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          test -f "$PS5_PAYLOAD_SDK/toolchain/prospero.mk"
      - name: Resolve newest public releases and build
        run: python3 scripts/build.py --profile "$PROFILE"
      - name: Save ELF, ZIP and manifest (public workflow artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ps5-aio-${{ env.PROFILE }}-${{ github.run_number }}
          path: |
            dist/*.elf
            dist/*.zip
            dist/*.json
          if-no-files-found: error
          retention-days: 30
