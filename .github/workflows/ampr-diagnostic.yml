name: AMPR diagnostic 0.4.0

'on':
  push:
    branches: ['codex/ampr-ready-handoff-0.4.0']
    paths: ['ampr-diagnostics/**', '.github/workflows/ampr-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ampr-diagnostic-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verified-sprx:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-config
      - uses: actions/checkout@v4
        with:
          repository: quer3q/ampr-emu-ng
          ref: cd0c11efeedec45f2ed01715ff33c00898d40240
          path: upstream
          persist-credentials: false
      - name: Apply diagnostic patch
        run: |
          mkdir -p dist
          git -C upstream apply --check ../build-config/ampr-diagnostics/diagnostics.patch
          git -C upstream apply ../build-config/ampr-diagnostics/diagnostics.patch
          cp build-config/ampr-diagnostics/README_RU.txt dist/
          cp build-config/ampr-diagnostics/PROTOCOL.md dist/
          cp upstream/LICENSE dist/LICENSE
      - name: Install host Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: ampr-diag-host-${{ runner.os }}-1.99-cd0c11e
      - name: Host tests and static storage measurement
        working-directory: upstream
        run: |
          cargo test --workspace --locked 2>&1 | tee ../dist/host-tests.log
          cargo test -p ampr-sys --features mem_report rt::reactor::ready_handoff -- --nocapture 2>&1 | tee ../dist/ready-tests.log
          cargo test -p ampr-sys --features mem_report rt::reactor::lane_overlap -- --nocapture 2>&1 | tee ../dist/order-tests.log
          cargo test -p ampr-sys rt::diag -- --nocapture 2>&1 | tee ../dist/storage.log
      - name: Build and verify release and diagnostic SPRX
        working-directory: upstream
        run: ./ps5/build-docker.sh dist AMPR_GIT_REV="${GITHUB_SHA}-diag04" 2>&1 | tee ../dist/build.log
      - name: Package verified diagnostic binary and complete corresponding source
        run: |
          cp upstream/libSceAmpr-debug.sprx dist/libSceAmpr-diag-0.4.0.sprx
          cp build-config/ampr-diagnostics/diagnostics.patch dist/
          tar --exclude=.git --exclude=out --exclude=target --exclude='*.sprx' -czf dist/ampr-emu-ng-diagnostic-source.tar.gz -C upstream .
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('dist')
          binary=root/'libSceAmpr-diag-0.4.0.sprx'
          info={'name':'ampr-emu-ng diagnostic','diagnostic_version':'0.4.0','protocol':2,
                'upstream_commit':'cd0c11efeedec45f2ed01715ff33c00898d40240',
                'build_commit':os.environ['GITHUB_SHA'],'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),
                'host_tests_passed':True,'prx_sprx_verifier_passed':True,
                'console_tested':False,'firmware_specific_patches_added':False}
          (root/'BUILD_INFO.json').write_text(json.dumps(info,indent=2)+'\n')
          files=[p for p in sorted(root.iterdir()) if p.is_file() and p.name!='SHA256SUMS']
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ampr-diagnostic-0.4.0-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

